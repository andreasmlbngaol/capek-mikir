# Nginx config for serving Flutter Web on Hugging Face Spaces.
# - Listens on port 7860 (required by HF Spaces).
# - Runs as non-root: pid + temp paths point to writable locations.
# - SPA fallback so go_router deep links work on refresh.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for non-root user
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    sendfile        on;
    keepalive_timeout 65;

    # Compression for faster loads
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm
        application/octet-stream;

    server {
        listen 7860;
        listen [::]:7860;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Ensure correct MIME type for the WASM (CanvasKit) runtime
        location ~* \.wasm$ {
            default_type application/wasm;
        }

        # Cache static assets aggressively (they are content-hashed)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|ttf|otf|woff|woff2|json|wasm)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # SPA fallback for go_router deep links
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
